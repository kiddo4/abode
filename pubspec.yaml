name: abode
description: "A 3D real estate marketplace showcasing the Glint engine."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0-110.0.dev

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  glint_engine: ^0.2.0
  liquid_glass_widgets: ^0.29.7

dependency_overrides:
  glint_engine:
    path: ../glint_engine_src

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/exterior/
    - assets/models/kit/
    - assets/hdri/

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
